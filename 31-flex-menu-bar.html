<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HTML/CSS practice assignment by Muhammad Saif Khan."><meta name="author" content="Muhammad Saif Khan">
  <title>Flexbox Menu Bar | Muhammad Saif Khan</title>
  <style>
:root{--ink:#172033;--muted:#667085;--brand:#3157d5;--brand-dark:#203da5;--bg:#f5f7fb;--surface:#fff;--line:#e4e8f0;--accent:#dce6ff;--radius:18px;--shadow:0 12px 34px rgba(25,42,80,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:clamp(18px,4vw,52px);max-width:1200px;margin-inline:auto}
h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2rem,5vw,3.8rem);line-height:1.1;letter-spacing:-.04em}h2{font-size:1.45rem;line-height:1.25}p{color:var(--muted)}a{color:var(--brand);text-underline-offset:4px}img{display:block;max-width:100%;height:auto;border-radius:12px}section,article,header,footer,nav,main,aside{min-width:0}section,article{margin-block:20px}header{margin-bottom:28px}hr{border:0;border-top:1px solid var(--line);margin:24px 0}
nav{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:32px}nav a{text-decoration:none;font-weight:600}.brand{font-weight:850;letter-spacing:.06em;color:var(--ink)}.links{display:flex;gap:20px;flex-wrap:wrap}.button,button{display:inline-flex;align-items:center;justify-content:center;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:11px 17px;text-decoration:none;font-weight:700;cursor:pointer}.button:hover,button:hover{background:var(--brand-dark)}.text-link{font-weight:700;text-decoration:none}.eyebrow{font-size:.78rem;letter-spacing:.16em;font-weight:800;color:var(--brand);text-transform:uppercase}
.card,.product,.project,.panel,.login,.dash-panel,.stats article,.responsive-cards article,.audit-grid article,.feature-grid article,.three-cols article{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.cards,.products,.product-grid,.project-grid,.responsive-cards,.audit-grid,.feature-grid,.three-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:18px}
.cards article,.products article,.product-grid article,.project-grid article{margin:0}
form{max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;display:grid;gap:10px;box-shadow:var(--shadow)}label{font-weight:700;margin-top:6px}input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #cbd3e1;border-radius:9px;background:#fff;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:3px solid var(--accent);border-color:var(--brand)}.note,small{font-size:.88rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}caption{text-align:left;padding:12px;font-weight:700}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}th{background:#edf1fb}figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}figcaption{padding:8px;font-weight:650}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}.gallery img{width:100%;aspect-ratio:3/2;object-fit:cover}
.hero,.split-hero,.desktop-hero,.final-hero{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:clamp(28px,6vw,80px);padding:clamp(26px,5vw,64px);background:linear-gradient(135deg,#fff,#edf2ff);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);margin-block:24px}.hero p,.split-hero p,.desktop-hero p,.final-hero p{max-width:56ch}.hero-art,.visual-panel,.desktop-art,.final-art{min-height:240px;border-radius:22px;background:linear-gradient(135deg,#dfe7ff,#a9bcff);display:flex;align-items:center;justify-content:center;padding:24px;color:#1d327e;font-size:clamp(2rem,5vw,4rem);font-weight:900}.actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:22px}.trust{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px;font-size:.88rem;color:var(--muted)}.final-hero h1 span{color:var(--brand)}.feature-icon{display:inline-grid;place-items:center;background:var(--accent);color:var(--brand);width:42px;height:42px;border-radius:12px;font-weight:800}.process{text-align:center;padding:56px 20px}.process p{max-width:620px;margin-inline:auto}.final-art .art-window{background:#fff;border:1px solid #d8e0f2;border-radius:18px;padding:20px;width:100%;font-size:1rem;box-shadow:var(--shadow)}.window-dots{color:#90a3d9;font-size:.7rem;margin-bottom:18px}.art-line{height:9px;width:60%;background:#e9edf7;border-radius:20px;margin:10px 0}.art-line.wide{width:88%;height:14px;background:#cbd8ff}.art-task{background:#f4f6fb;border-radius:9px;padding:10px;margin-top:8px;font-size:.82rem;color:#34405b}.art-task span{color:var(--brand);margin-right:8px}.art-task.pending{color:#8a91a1}
.outer{display:inline-block;background:#dfe7ff;padding:28px;border:3px dashed var(--brand);margin:20px}.box{background:#fff;padding:30px;border:5px solid #3157d5}.caption{font-size:.9rem}.highlight{background:#fff0bf;padding:8px}.card.featured{background:#eaf0ff;border-color:#9bb1ff}.card.outline{box-shadow:none;border:2px dashed #9aa8c4}.card span,.project span{font-size:.78rem;letter-spacing:.12em;color:var(--brand);font-weight:800}.scroll-safe{display:flex;flex-wrap:wrap;gap:14px}.item{flex:1 1 220px;min-width:0;overflow-wrap:anywhere;padding:22px;background:#fff;border:1px solid var(--line);border-radius:12px}.orb{position:absolute;width:220px;height:220px;border-radius:50%;background:#b9c9ff;right:8%;top:10%;z-index:0;opacity:.7}.hero{position:relative;overflow:hidden}.hero .content{position:relative;z-index:1}.avatar{display:grid;place-items:center;width:78px;height:78px;background:var(--accent);border-radius:50%;font-size:1.6rem;font-weight:850;color:var(--brand)}.product-art{display:grid;place-items:center;min-height:120px;background:#f0f3fa;border-radius:12px;font-size:3.5rem;margin-bottom:18px}.product strong{font-size:1.2rem}.login-wrap{min-height:72vh;display:flex;align-items:center;justify-content:center}.login{width:min(100%,460px)}.login h1{font-size:2.4rem}.breakpoint-label{padding:12px 16px;background:#e5edff;border-radius:10px;font-weight:700;color:var(--brand);margin-bottom:20px}.dashboard{display:grid;grid-template-areas:"head head" "side main" "foot foot";grid-template-columns:220px 1fr;gap:18px}.dash-head{grid-area:head;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;background:#fff;padding:20px;border-radius:16px}.dash-head h1{font-size:1.8rem;margin:0}.dash-side{grid-area:side;background:#e9efff;border-radius:16px;padding:20px}.dash-main{grid-area:main}.dash-foot{grid-area:foot;text-align:center;padding:16px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}.stats article{margin:0;display:grid}.stats strong{font-size:1.8rem}.shop-layout{display:grid;grid-template-columns:220px 1fr;gap:24px}.shop-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--line)}.filters{background:#fff;padding:20px;border-radius:16px;align-self:start}.portfolio-head{max-width:780px}.project-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}.project{min-height:190px}.desktop-art .art-card{font-size:1rem;background:#fff;border-radius:16px;padding:24px;width:100%;box-shadow:var(--shadow);display:grid;gap:16px}.art-card strong{font-size:1.5rem}.art-card span{font-size:.8rem;color:var(--muted)}footer{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px;margin-top:40px;color:var(--muted);font-size:.9rem}
@media(max-width:720px){body{padding:18px}.hero,.split-hero,.desktop-hero,.final-hero{grid-template-columns:1fr;padding:26px}.hero-art,.visual-panel,.desktop-art,.final-art{min-height:180px}.dashboard{grid-template-areas:"head" "main" "side" "foot";grid-template-columns:1fr}.shop-layout{grid-template-columns:1fr}.shop-head{grid-column:auto}.dash-head{display:block}.dash-head span{display:block;margin-top:8px}.orb{right:-40px;top:20px;width:150px;height:150px}.links{gap:12px}.process{padding:34px 8px}}
@media(min-width:721px) and (max-width:1000px){.hero,.split-hero,.desktop-hero,.final-hero{gap:24px;padding:30px}.dashboard{grid-template-columns:170px 1fr}}
</style>
